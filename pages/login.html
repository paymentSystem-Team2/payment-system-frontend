    <script>
        // ── 소셜 로그인 ──
        async function socialLogin(provider) {
            const config = await getConfig();
            const baseUrl = config.api.baseUrl;
            window.location.href = baseUrl + '/oauth2/authorization/' + provider;
        }

        // OAuth2 콜백: URL에 access_token이 있으면 저장 후 홈으로 이동
        (function handleOAuth2Callback() {
            const params = new URLSearchParams(window.location.search);
            const accessToken = params.get('access_token');
            if (accessToken) {
                saveToken(accessToken);
                window.location.href = '/';
            }
        })();

        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');

            // 에러 메시지 숨기기
            errorMessage.style.display = 'none';

            try {
                // returnHeaders: true 옵션으로 헤더도 받아오기
                const result = await makeApiRequest('login', {
                    body: {
                        email: email,
                        password: password
                    },
                    returnHeaders: true
                });

                // YML 스키마 기반 자동 검증
                if (!validateApiResponse('login', result.data, result.headers)) {
                    errorText.textContent = 'API 응답 형식이 올바르지 않습니다.';
                    errorMessage.style.display = 'block';
                    return;
                }

                if (result.data.success) {
                    // Authorization 헤더에서 토큰 추출
                    const authHeader = result.headers['authorization'];
                    if (authHeader && authHeader.startsWith('Bearer ')) {
                        const token = authHeader.substring(7);  // "Bearer " 제거

                        // JWT 토큰을 쿠키에 저장
                        saveToken(token);

                        // 홈으로 이동
                        window.location.href = '/';
                    } else {
                        errorText.textContent = '토큰을 받을 수 없습니다.';
                        errorMessage.style.display = 'block';
                    }
                } else {
                    // 로그인 실패
                    errorText.textContent = result.data.message || '이메일 또는 비밀번호가 올바르지 않습니다.';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                console.error('로그인 오류:', error);
                errorText.textContent = '로그인 중 오류가 발생했습니다.';
                errorMessage.style.display = 'block';
            }
        }

        // 이미 로그인되어 있으면 홈으로 이동 (쿠키 체크)
        if (getToken()) {
            window.location.href = '/';
        }
    </script>

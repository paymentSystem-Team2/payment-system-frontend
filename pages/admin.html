<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>admin - 관리자 사이트</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
    <script src="/js/cookie-util.js"></script>
    <script src="/js/app-config.js"></script>
    <script src="/js/api-handler.js"></script>
    <script src="/js/api-validator.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/portone-sdk.js"></script>
    <script src="/js/auth-check.js"></script>
</head>
<body>
<div class="main-container">
    <div class="content-area">
        <h1 style="font-size: 2rem; margin-bottom: 2rem;">📦 전체 주문 관리</h1>

        <!-- 주문 목록 -->
        <div class="card">
            <div class="card-header">전체 주문 목록</div>
            <div class="card-body">
                <div id="order-list-loading" style="text-align: center; padding: 2rem; color: var(--text-secondary);">
                    주문 목록을 불러오는 중...
                </div>
                <div id="order-list-container" style="display: none;">
                    <table style="width: 100%; border-collapse: collapse;">
                        <thead>
                        <tr style="border-bottom: 2px solid var(--border); text-align: left;">
                            <th style="padding: 0.75rem;">주문 번호</th>
                            <th style="padding: 0.75rem;">주문 ID</th>
                            <th style="padding: 0.75rem;">금액</th>
                            <th style="padding: 0.75rem;">포인트</th>
                            <th style="padding: 0.75rem;">상태</th>
                            <th style="padding: 0.75rem; text-align: center;">작업</th>
                        </tr>
                        </thead>
                        <tbody id="order-list-body">
                        <!-- 주문 목록이 여기에 렌더링됩니다 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="api-panel">
        <div class="panel-section">
            <h3 class="panel-title">📡 현재 엔드포인트</h3>
            <div id="current-endpoint" class="endpoint-badge">아직 요청 없음</div>
        </div>
        <div class="panel-section">
            <h3 class="panel-title">📤 요청</h3>
            <textarea id="request-body" class="api-textarea"></textarea>
        </div>
        <div class="panel-section">
            <h3 class="panel-title">📥 응답</h3>
            <pre id="response-output" class="response-box">요청 대기 중...</pre>
        </div>
    </div>
</div>

<script>
    // 현재 사용자 정보
    let currentUser = null;
    let orders = [];

    // API 목록 동적 생성
    async function populateApiList() {
        const apiListElement = document.getElementById('api-list-orders');
        if (!apiListElement) return;

        try {
            // config 로드 대기
            const config = await getConfig();
            const endpoints = config?.api?.endpoints;

            if (!endpoints) {
                apiListElement.innerHTML = '';
                return;
            }

            // orders.html에 필요한 API들
            const requiredApis = ['list-orders', 'create-payment', 'confirm-payment', 'cancel-payment'];
            const apiItems = [];

            requiredApis.forEach(apiKey => {
                const apiConfig = endpoints[apiKey];
                if (apiConfig && apiConfig.url) {
                    const method = apiConfig.method || 'GET';
                    const description = apiConfig.description || '';
                    apiItems.push(`<li><code>${method} ${apiConfig.url}</code> - ${description}</li>`);
                }
            });

            // API가 정의되어 있으면 표시, 없으면 빈 문자열
            apiListElement.innerHTML = apiItems.join('');
        } catch (error) {
            console.error('API 목록 로드 실패:', error);
            apiListElement.innerHTML = '';
        }
    }

    // 페이지 로드 시 초기화
    document.addEventListener('DOMContentLoaded', async () => {
        // API 목록 동적 생성 (비동기)
        populateApiList();


        await loadCurrentUser();
        await loadOrders();
    });

    // 사용자 정보 로드
    async function loadCurrentUser() {
        try {
            currentUser = await makeApiRequest('get-current-user', {
            });

            if (!validateApiResponse('get-current-user', currentUser)) {
                throw new Error('API 응답 형식이 올바르지 않습니다.');
            }
        } catch (error) {
            console.error('Failed to load user info:', error);
            currentUser = null;
        }
    }

    // 주문 목록 로드
    async function loadOrders() {
        const loadingEl = document.getElementById('order-list-loading');
        const containerEl = document.getElementById('order-list-container');
        const emptyEl = document.getElementById('order-list-empty');

        try {
            const result = await makeApiRequest('list-orders', {
            });

            // YML 스키마 기반 자동 검증
            if (!validateApiResponse('list-orders', result)) {
                throw new Error('API 응답 형식이 올바르지 않습니다.');
            }

            orders = result;
            loadingEl.style.display = 'none';

            if (orders.length === 0) {
                emptyEl.style.display = 'block';
            } else {
                containerEl.style.display = 'block';
                renderOrderList();
            }
        } catch (error) {
            console.error('Failed to load orders:', error);
            loadingEl.innerHTML = '<span style="color: var(--danger);">주문 목록을 불러오는데 실패했습니다.</span>';
        }
    }

    // 주문 목록 렌더링
    function renderOrderList() {
        const tbody = document.getElementById('order-list-body');
        tbody.innerHTML = '';

        orders.forEach(order => {
            const tr = document.createElement('tr');
            tr.style.borderBottom = '1px solid var(--border)';

            // 상태에 따른 스타일
            const statusStyle = getStatusStyle(order.status);

            // 포인트 정보 구성
            const usedPoints = order.usedPoints || 0;
            const earnedPoints = order.earnedPoints || 0;
            const finalAmount = order.finalAmount || order.totalAmount;

            let pointsDisplay = '';
            if (usedPoints > 0 || earnedPoints > 0) {
                pointsDisplay = '<div style="font-size: 0.875rem;">';
                if (usedPoints > 0) {
                    pointsDisplay += `<div style="color: var(--danger);">-${usedPoints.toLocaleString()}P</div>`;
                }
                if (earnedPoints > 0) {
                    pointsDisplay += `<div style="color: var(--success);">+${earnedPoints.toLocaleString()}P</div>`;
                }
                pointsDisplay += '</div>';
            } else {
                pointsDisplay = '<span style="color: var(--text-secondary); font-size: 0.875rem;">-</span>';
            }

            tr.innerHTML = `
                    <td style="padding: 0.75rem; font-weight: 600;">${order.orderNumber}</td>
                    <td style="padding: 0.75rem; font-family: monospace; font-size: 0.875rem; color: var(--text-secondary);">${order.orderId}</td>
                    <td style="padding: 0.75rem;">
                        <div style="font-weight: 600;">${order.totalAmount.toLocaleString()}원</div>
                        ${usedPoints > 0 ? `<div style="font-size: 0.75rem; color: var(--text-secondary);">실결제: ${finalAmount.toLocaleString()}원</div>` : ''}
                    </td>
                    <td style="padding: 0.75rem;">
                        ${pointsDisplay}
                    </td>
                    <td style="padding: 0.75rem;">
                        <span style="display: inline-block; padding: 0.25rem 0.75rem; border-radius: 4px; font-size: 0.875rem; font-weight: 500; ${statusStyle}">
                            ${getStatusText(order.status)}
                        </span>
                    </td>
                    <td style="padding: 0.75rem; text-align: center;">
                        ${getActionButton(order, finalAmount)}
                    </td>
                `;

            tbody.appendChild(tr);
        });
    }

    function getActionButton(order, finalAmount) {
        if (order.status === 'PAID') {
            return `
            <button class="btn btn-success" style="padding: 0.5rem 1rem; font-size: 0.875rem;" onclick="deliveryProcess('${order.orderId}')">
                🚚 배송 시작
            </button>
        `;
        }

        if (order.status === 'SHIPPED') {
            return `
            <button class="btn btn-success" style="padding: 0.5rem 1rem; font-size: 0.875rem;" onclick="deliveryProcess('${order.orderId}')">
                📦 배송 완료
            </button>
        `;
        }

        return `<span style="color: var(--text-secondary); font-size: 0.875rem;">-</span>`;
    }

    async function deliveryProcess(orderId){
        try {
            await makeApiRequest('process-delivery', {
                pathParams: orderId
            });

            showNotification('업데이트 성공!', 'success');
            await loadOrders();
        } catch (error) {
            showNotification('업데이트 실패!', 'success');
            console.error('Failed to confirm payment:', error);
        }
    }

    // 주문 결제하기
    async function payOrder(orderId, totalAmount) {
        if (!currentUser) {
            showNotification('⚠️ 사용자 정보를 먼저 로드해주세요', 'warning');
            return;
        }

        // 해당 주문 찾기
        const order = orders.find(o => o.orderId === orderId);
        if (!order) {
            showNotification('⚠️ 주문을 찾을 수 없습니다', 'error');
            return;
        }

        try {
            const paymentData = {
                orderId: orderId,
                orderName: `주문 ${order.orderNumber}`,  // 주문 번호로 표시
                totalAmount: totalAmount,
                currency: 'KRW',
                payMethod: 'CARD',
                customer: {
                    customerId: currentUser.customerUid,  // PortOne에 전달할 고객 UID
                    fullName: currentUser.name,
                    phoneNumber: currentUser.phone || '01012345678',  // KG 이니시스 필수
                    email: currentUser.email
                }
            };

            const result = await openPortOnePayment(paymentData);

            if (result.paymentId) {
                // 결제 완료 후 모드 B에 자동 입력
                document.getElementById('manual-payment-id').value = result.paymentId;

                showNotification('💳 결제 완료! 아래에서 결제 확정/취소를 테스트할 수 있습니다.', 'success');

                // 주문 목록 새로고침
                await loadOrders();
            }
        } catch (error) {
            console.error('Payment failed:', error);
        }
    }

    // 모드 B: 수동 결제 확정
    async function manualConfirmPayment() {
        const paymentId = document.getElementById('manual-payment-id').value.trim();

        if (!paymentId) {
            showNotification('⚠️ 결제 ID를 입력해주세요', 'warning');
            return;
        }

        try {
            await confirmPaymentTemplate(paymentId);
            await loadOrders(); // 주문 목록 새로고침
        } catch (error) {
            console.error('Failed to confirm payment:', error);
        }
    }

    // 모드 B: 수동 결제 취소
    async function manualCancelPayment() {
        const paymentId = document.getElementById('manual-payment-id').value.trim();

        if (!paymentId) {
            showNotification('⚠️ 결제 ID를 입력해주세요', 'warning');
            return;
        }

        if (!confirm('정말 이 결제를 취소하시겠습니까?')) {
            return;
        }

        try {
            await cancelPaymentTemplate(paymentId, 'Customer request');
            await loadOrders(); // 주문 목록 새로고침
        } catch (error) {
            console.error('Failed to cancel payment:', error);
        }
    }

    // 상태 스타일 반환
    function getStatusStyle(status) {
        const styles = {
            'PENDING': 'background: #FEF3C7; color: #92400E;',
            'PAID': 'background: #D1FAE5; color: #065F46;',
            'CANCELLED': 'background: #FEE2E2; color: #991B1B;',
            'SHIPPED': 'background: #DBEAFE; color: #1E40AF;',
            'DELIVERED': 'background: #E0E7FF; color: #3730A3;',
            'PURCHASE_CONFIRMED': 'background: #E0E7FF; color: #3730A3;'
        };
        return styles[status] || 'background: #F3F4F6; color: #374151;';
    }

    // 상태 텍스트 반환
    function getStatusText(status) {
        const texts = {
            'PENDING': '결제 대기',
            'PAID': '결제 완료',
            'CANCELLED': '취소됨',
            'SHIPPED': '배송중',
            'DELIVERED': '배송 완료',
            'PURCHASE_CONFIRMED': '구매 확정(포인트 지급 완료)'
        };
        return texts[status] || status;
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commerce Demo</title>

    <link rel="stylesheet" href="/css/style.css">

    <script src="https://cdn.portone.io/v2/browser-sdk.js"></script>

    <script src="/js/app-config.js"></script>
    <script src="/js/api-handler.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/portone-sdk.js"></script>
</head>
<body>
<nav class="navbar">
    <div class="navbar-container">
        <a href="/" class="navbar-brand">
            <span>🏪 CommerceHub</span>
        </a>

        <ul class="navbar-nav">
            <li><a href="/" class="nav-link">Home</a></li>
            <li><a href="/pages/shop.html" class="nav-link">Shop</a></li>
            <li><a href="/pages/orders.html" class="nav-link">Orders</a></li>
            <li><a href="/pages/plans.html" class="nav-link">Plans</a></li>
            <li><a href="/pages/subscribe.html" class="nav-link">Subscribe</a></li>
            <li><a href="/pages/subscriptions.html" class="nav-link">Subscriptions</a></li>
            <li><a href="/pages/config.html" class="nav-link">Config</a></li>
        </ul>

        <div class="navbar-actions">
            <div class="config-badge-container">
                <span class="config-badge skeleton" style="width: 100px; height: 24px;"></span>
            </div>
            <button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()">🌙</button>
        </div>
    </div>
</nav>

<div class="main-container">
    <div class="content-area">
        <!-- 여기에 각 페이지 내용 직접 넣기 -->
    </div>

    <div class="api-panel">
        <div class="panel-section">
            <h3 class="panel-title">📡 Current Endpoint</h3>
            <div id="current-endpoint" class="endpoint-badge">
                No request yet
            </div>
        </div>

        <div class="panel-section">
            <h3 class="panel-title">📤 Request</h3>
            <div class="form-group">
                <label class="form-label">Method</label>
                <select id="request-method" class="form-select">
                    <option value="GET">GET</option>
                    <option value="POST" selected>POST</option>
                    <option value="PUT">PUT</option>
                    <option value="DELETE">DELETE</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Custom URL (optional)</label>
                <input type="text" id="custom-endpoint" class="form-input" placeholder="http://localhost:8080/api/...">
            </div>
            <label class="form-label">Body (JSON)</label>
            <textarea id="request-body" class="api-textarea" placeholder='{\n  "example": "data"\n}'></textarea>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="sendCustomRequest()">Send Custom</button>
                <button class="btn btn-outline" onclick="clearResponse()">Clear</button>
            </div>
        </div>

        <div class="panel-section">
            <h3 class="panel-title">📥 Response</h3>
            <pre id="response-output" class="response-box">Waiting for request...</pre>
        </div>
    </div>
</div>
        <script src="/js/stickers.js"></script>
    <script src="/js/bling.js"></script>
</body>
</html>
